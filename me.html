<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amar Shindhe</title>
  <style>
    [hidden]{display:none!important}
    body{margin:0}
    /* Fill the screen the same way for every photo so the swap doesn't jump between sizes. */
    img{position:fixed;inset:0;width:100%;height:100%;object-fit:contain}
    #tap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;font:18px/1.5 system-ui,sans-serif;cursor:pointer}
  </style>
</head>
<body>
  <div id="tap" hidden>Tap to pledge allegiance to<br>Supreme Leader Kylian 🫡</div>
  <img src="/assets/kylian-dictador.png" alt="" hidden>
  <audio src="/assets/kylian-dictador-30s.mp3" preload="auto"></audio>
  <script>
    // The photos show once the song starts and keep cycling every 5s, back to the first after the last.
    // Browsers block audio until the visitor interacts, so ask for a tap when autoplay is refused.
    const pics = [
      '/assets/kylian-dictador.png',
      '/assets/kylian-poster-crowd.jpg',
      '/assets/kylian-portrait.jpg',
      '/assets/kylian-poster-sun.jpg',
    ];
    pics.forEach(src => { new Image().src = src; }); // preload so every swap is instant
    const song = document.querySelector('audio');
    const photo = document.querySelector('img');
    const tap = document.getElementById('tap');
    let shown = false;
    let pic = 0;
    const show = () => {
      if (shown) return;
      shown = true;
      tap.hidden = true;
      photo.hidden = false;
      setInterval(() => {
        pic = (pic + 1) % pics.length;
        photo.src = pics[pic];
      }, 5000);
    };
    // Mobile and in-app browsers (Instagram) only grant audio on click, not pointerdown/touchstart.
    const start = () => {
      removeEventListener('keydown', start);
      song.play().catch(() => {});
      show();
    };
    song.play().then(show).catch(() => {
      tap.hidden = false;
      tap.addEventListener('click', start, { once: true });
      addEventListener('keydown', start);
    });
    // In-app browsers ignore preload, so download the song up front and it plays the instant they tap.
    fetch(song.src).then(r => r.blob()).then(b => {
      if (song.paused) song.src = URL.createObjectURL(b);
    });
  </script>
</body>
</html>
